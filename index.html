<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#07111f">

  <link rel="manifest" href="manifest.json">

  <link rel="apple-touch-icon" href="icon-192.png">

  <title>عداد الأوراد</title>

  <style>
    :root {
      --background: #07111f;
      --background-secondary: #0d1a2d;
      --card: rgba(15, 27, 46, 0.94);
      --card-light: rgba(255, 255, 255, 0.06);
      --border: rgba(255, 255, 255, 0.11);
      --text: #f8fafc;
      --muted: #94a3b8;
      --green: #22c55e;
      --green-dark: #15803d;
      --blue: #3b82f6;
      --blue-dark: #1d4ed8;
      --red: #ef4444;
      --red-dark: #b91c1c;
      --orange: #f59e0b;
      --input: rgba(2, 8, 23, 0.74);
      --overlay-bg: rgba(0, 0, 0, 0.72);
      --modal-bg: #101d31;
      --confirm-icon-bg: rgba(239, 68, 68, 0.14);
      --confirm-icon-color: #fecaca;
      --confirm-text: #94a3b8;
      --progress-track: rgba(255, 255, 255, 0.08);
      --glow-1: rgba(59, 130, 246, 0.2);
      --glow-2: rgba(34, 197, 94, 0.14);
    }

    [data-theme="girly"] {
      --background: #1a0d1a;
      --background-secondary: #2a1428;
      --card: rgba(45, 20, 40, 0.94);
      --card-light: rgba(255, 255, 255, 0.08);
      --border: rgba(255, 255, 255, 0.12);
      --text: #fdf2f8;
      --muted: #c4b5c9;
      --green: #ec4899;
      --green-dark: #be185d;
      --blue: #f472b6;
      --blue-dark: #db2777;
      --red: #fb7185;
      --red-dark: #e11d48;
      --orange: #fbbf24;
      --input: rgba(26, 13, 26, 0.74);
      --overlay-bg: rgba(20, 8, 18, 0.75);
      --modal-bg: #2a1428;
      --confirm-icon-bg: rgba(251, 113, 133, 0.16);
      --confirm-icon-color: #fecdd3;
      --confirm-text: #c4b5c9;
      --progress-track: rgba(255, 255, 255, 0.1);
      --glow-1: rgba(244, 114, 182, 0.22);
      --glow-2: rgba(236, 72, 153, 0.14);
    }

    [data-theme="light"] {
      --background: #f1f5f9;
      --background-secondary: #e2e8f0;
      --card: rgba(255, 255, 255, 0.92);
      --card-light: rgba(0, 0, 0, 0.04);
      --border: rgba(0, 0, 0, 0.1);
      --text: #0f172a;
      --muted: #64748b;
      --green: #16a34a;
      --green-dark: #15803d;
      --blue: #2563eb;
      --blue-dark: #1d4ed8;
      --red: #dc2626;
      --red-dark: #b91c1c;
      --orange: #ea580c;
      --input: rgba(241, 245, 249, 0.8);
      --overlay-bg: rgba(0, 0, 0, 0.5);
      --modal-bg: #ffffff;
      --confirm-icon-bg: rgba(220, 38, 38, 0.12);
      --confirm-icon-color: #fca5a5;
      --confirm-text: #64748b;
      --progress-track: rgba(0, 0, 0, 0.08);
      --glow-1: rgba(37, 99, 235, 0.12);
      --glow-2: rgba(22, 163, 74, 0.1);
    }

    [data-theme="nature"] {
      --background: #0f1a14;
      --background-secondary: #16241b;
      --card: rgba(22, 36, 27, 0.94);
      --card-light: rgba(255, 255, 255, 0.06);
      --border: rgba(255, 255, 255, 0.11);
      --text: #f0fdf4;
      --muted: #86efac;
      --green: #4ade80;
      --green-dark: #16a34a;
      --blue: #38bdf8;
      --blue-dark: #0284c7;
      --red: #f87171;
      --red-dark: #dc2626;
      --orange: #fbbf24;
      --input: rgba(15, 26, 20, 0.74);
      --overlay-bg: rgba(0, 0, 0, 0.72);
      --modal-bg: #16241b;
      --confirm-icon-bg: rgba(248, 113, 113, 0.14);
      --confirm-icon-color: #fecaca;
      --confirm-text: #86efac;
      --progress-track: rgba(255, 255, 255, 0.08);
      --glow-1: rgba(56, 189, 248, 0.18);
      --glow-2: rgba(74, 222, 128, 0.14);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      min-height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      padding:
        max(8px, env(safe-area-inset-top))
        max(8px, env(safe-area-inset-right))
        max(8px, env(safe-area-inset-bottom))
        max(8px, env(safe-area-inset-left));

      color: var(--text);

      font-family:
        Tahoma,
        Arial,
        system-ui,
        sans-serif;

      background:
        radial-gradient(
          circle at top right,
          var(--glow-1),
          transparent 30%
        ),
        radial-gradient(
          circle at bottom left,
          var(--glow-2),
          transparent 30%
        ),
        linear-gradient(
          145deg,
          var(--background),
          var(--background-secondary)
        );
    }

    button,
    input {
      font-family: inherit;
    }

    button {
      cursor: pointer;
      touch-action: manipulation;
    }

    button:active {
      transform: scale(0.97);
    }

    .app {
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      gap: 7px;

      width: 100%;
      max-width: 540px;
      height: 100%;
      margin: 0 auto;
    }

    .top-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 43px;
      position: relative;
    }

    .title-area {
      min-width: 0;
      text-align: center;
    }

    .sidebar-toggle {
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      flex-shrink: 0;
      width: 42px;
      height: 42px;
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      background: var(--card-light);
      font-size: 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 150ms ease;
    }

    .sidebar-toggle:active {
      transform: translateY(-50%) scale(0.92);
    }

    .title-area h1 {
      margin: 0;
      font-size: clamp(20px, 5.8vw, 29px);
      font-weight: 900;
    }

    .title-area p {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 10px;
    }

    .dedication {
      margin: 3px 0 0;
      color: #e2e8f0;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 0.2px;
      text-shadow: 0 1px 8px rgba(226, 232, 240, 0.15);
    }

    .new-session-button {
      flex-shrink: 0;
      min-height: 40px;
      padding: 8px 12px;
      border: 0;
      border-radius: 12px;
      color: white;
      background: linear-gradient(
        135deg,
        var(--blue),
        var(--blue-dark)
      );
      font-size: 12px;
      font-weight: bold;
    }

    .sessions-panel {
      padding: 6px;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.04);
    }

    .sessions-list {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
    }

    .sessions-list::-webkit-scrollbar {
      display: none;
    }

    .session-tab {
      flex: 0 0 auto;
      min-width: 105px;
      max-width: 155px;
      min-height: 39px;
      padding: 6px 9px;
      border: 1px solid var(--border);
      border-radius: 11px;
      color: var(--muted);
      background: var(--input);
      text-align: right;
    }

    .session-tab.active {
      color: white;
      border-color: rgba(59, 130, 246, 0.7);
      background: rgba(59, 130, 246, 0.18);
    }

    .session-tab-name {
      display: block;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-size: 11px;
      font-weight: bold;
    }

    .session-tab-number {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 9px;
      direction: ltr;
      text-align: right;
    }

    .main-area {
      min-height: 0;
    }

    .session-card {
      display: grid;
      grid-template-rows:
        auto
        minmax(86px, 1fr)
        auto
        auto
        auto
        auto;

      gap: 7px;

      width: 100%;
      height: 100%;
      min-height: 0;
      padding: 10px;

      border: 1px solid var(--border);
      border-radius: 20px;

      background: var(--card);

      box-shadow:
        0 18px 45px rgba(0, 0, 0, 0.34);
    }

    .session-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 34px;
    }

    .session-info {
      min-width: 0;
    }

    .session-name {
      margin: 0;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-size: clamp(16px, 5vw, 22px);
      font-weight: 900;
    }

    .session-target {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 10px;
    }

    .edit-button {
      flex-shrink: 0;
      min-width: 65px;
      min-height: 34px;
      padding: 6px 9px;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: white;
      background: var(--card-light);
      font-size: 11px;
      font-weight: bold;
    }

    .counter-section {
      display: grid;
      grid-template-rows: minmax(50px, 1fr) auto;
      gap: 6px;
      min-height: 0;
    }

    .counter-box {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 50px;
      padding: 4px;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--input);
    }

    .counter-box::before {
      content: "";
      position: absolute;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: var(--glow-2);
      filter: blur(17px);
    }

    #counterValue {
      position: relative;
      z-index: 1;
      max-width: 100%;
      overflow-wrap: anywhere;
      font-size: clamp(32px, 11vw, 60px);
      font-weight: 900;
      line-height: 1;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    #counterValue.animate {
      animation: counterAnimation 150ms ease-out;
    }

    @keyframes counterAnimation {
      from {
        transform: scale(0.92);
        opacity: 0.65;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .progress-area {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 7px;
    }

    .progress-track {
      height: 7px;
      overflow: hidden;
      border-radius: 999px;
      background: var(--progress-track);
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(
        90deg,
        var(--green),
        #4ade80
      );
      transition: width 200ms ease;
    }

    .progress-text {
      min-width: 45px;
      color: var(--muted);
      font-size: 10px;
      text-align: left;
    }

    .main-add-row {
      display: flex;
      gap: 7px;
      align-items: stretch;
    }

    .main-add-button {
      flex: 1;
      min-height: 51px;
      border: 0;
      border-radius: 14px;
      color: white;
      background: linear-gradient(
        135deg,
        var(--green),
        var(--green-dark)
      );
      font-size: 18px;
      font-weight: 900;
    }

    .undo-button {
      flex-shrink: 0;
      width: 56px;
      min-height: 51px;
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 14px;
      color: #fca5a5;
      background: rgba(239, 68, 68, 0.1);
      font-size: 22px;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .undo-button:active {
      transform: scale(0.95);
    }

    .manage-session-button {
      width: 100%;
      min-height: 40px;
      margin-top: 7px;
      padding: 8px 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      background: var(--card-light);
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .manage-session-button:active {
      transform: scale(0.97);
    }

    .manage-menu {
      display: none;
      flex-direction: column;
      gap: 7px;
      margin-top: 7px;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: var(--card-light);
    }

    .manage-menu.open {
      display: flex;
    }

    .manage-menu .compact-row,
    .manage-menu .bottom-actions {
      margin: 0;
    }

    .compact-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 88px;
      gap: 7px;
    }

    input {
      width: 100%;
      min-width: 0;
      min-height: 42px;
      padding: 7px 9px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 11px;
      outline: none;
      color: white;
      background: var(--input);
      font-size: 14px;
      font-weight: bold;
      text-align: center;
    }

    input:focus {
      border-color: rgba(59, 130, 246, 0.8);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12);
    }

    input::placeholder {
      color: #64748b;
      font-size: 11px;
      font-weight: normal;
    }

    .action-button {
      min-height: 42px;
      border: 0;
      border-radius: 11px;
      color: white;
      background: linear-gradient(
        135deg,
        var(--blue),
        var(--blue-dark)
      );
      font-size: 12px;
      font-weight: bold;
    }

    .bottom-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
    }

    .reset-button,
    .delete-button {
      min-height: 42px;
      border: 0;
      border-radius: 11px;
      color: white;
      font-size: 12px;
      font-weight: bold;
    }

    .reset-button {
      background: linear-gradient(
        135deg,
        var(--orange),
        #d97706
      );
    }

    .delete-button {
      background: linear-gradient(
        135deg,
        var(--red),
        var(--red-dark)
      );
    }

    .message {
      position: fixed;
      z-index: 4500;
      right: 50%;
      bottom: max(15px, env(safe-area-inset-bottom));
      transform: translateX(50%) translateY(20px);
      max-width: calc(100% - 30px);
      padding: 9px 15px;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--text);
      background: var(--modal-bg);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35);
      font-size: 11px;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition:
        opacity 150ms ease,
        transform 150ms ease;
    }

    .message.visible {
      opacity: 1;
      transform: translateX(50%) translateY(0);
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      width: 100%;
      height: 100%;
      padding: 22px;

      border: 1px solid var(--border);
      border-radius: 20px;

      background: var(--card);

      text-align: center;
    }

    .empty-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 65px;
      height: 65px;
      margin-bottom: 14px;
      border-radius: 20px;
      color: var(--blue);
      background: var(--glow-1);
      font-size: 35px;
      font-weight: bold;
    }

    .empty-state h2 {
      margin: 0 0 7px;
      font-size: 21px;
    }

    .empty-state p {
      max-width: 300px;
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.8;
    }

    .empty-create-button {
      min-height: 45px;
      padding: 9px 20px;
      border: 0;
      border-radius: 13px;
      color: white;
      background: linear-gradient(
        135deg,
        var(--blue),
        var(--blue-dark)
      );
      font-size: 13px;
      font-weight: bold;
    }

    .modal-overlay {
      position: fixed;
      z-index: 1000;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding:
        max(12px, env(safe-area-inset-top))
        max(12px, env(safe-area-inset-right))
        max(12px, env(safe-area-inset-bottom))
        max(12px, env(safe-area-inset-left));

      background: var(--overlay-bg);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .modal-overlay.visible {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 470px;
      max-height: 100%;
      padding: 15px;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--modal-bg);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 13px;
    }

    .modal-header h2 {
      margin: 0;
      font-size: 19px;
    }

    .close-modal {
      width: 36px;
      height: 36px;
      border: 1px solid var(--border);
      border-radius: 11px;
      color: white;
      background: var(--card-light);
      font-size: 20px;
    }

    .form-group {
      margin-bottom: 10px;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      color: #e2e8f0;
      font-size: 11px;
      font-weight: bold;
    }

    .form-group input {
      min-height: 45px;
      text-align: right;
    }

    .modal-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 13px;
    }

    .modal-save,
    .modal-cancel {
      min-height: 44px;
      border: 0;
      border-radius: 12px;
      color: white;
      font-size: 12px;
      font-weight: bold;
    }

    .modal-save {
      background: linear-gradient(
        135deg,
        var(--green),
        var(--green-dark)
      );
    }

    .modal-cancel {
      background: rgba(255, 255, 255, 0.09);
    }

    @media (max-height: 650px) {
      .title-area p {
        display: none;
      }

      .top-header {
        min-height: 38px;
      }

      .session-card {
        padding: 8px;
        gap: 5px;
      }

      .counter-box {
        min-height: 58px;
      }

      #counterValue {
        font-size: clamp(36px, 12vw, 62px);
      }

      .main-add-button {
        min-height: 44px;
        font-size: 16px;
      }

      input,
      .action-button,
      .reset-button,
      .delete-button {
        min-height: 37px;
      }

      .session-tab {
        min-height: 34px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    @media (max-width: 340px) {
      .new-session-button {
        padding-inline: 8px;
        font-size: 10px;
      }

      .compact-row {
        grid-template-columns: minmax(0, 1fr) 74px;
      }

      .session-card {
        padding: 7px;
      }
    }

    .theme-sidebar {
      position: fixed;
      z-index: 2500;
      top: 50%;
      right: 0;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px 8px;
      border: 1px solid var(--border);
      border-right: 0;
      border-radius: 14px 0 0 14px;
      background: var(--modal-bg);
      box-shadow: -6px 0 20px rgba(0, 0, 0, 0.3);
    }

    .theme-button {
      width: 34px;
      height: 34px;
      border: 2px solid transparent;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 150ms ease, border-color 150ms ease;
    }

    .theme-button:active {
      transform: scale(0.9);
    }

    .theme-button.active {
      border-color: var(--text);
    }

    .theme-button-night {
      background: linear-gradient(135deg, #07111f, #0d1a2d);
    }

    .theme-button-girly {
      background: linear-gradient(135deg, #1a0d1a, #2a1428);
    }

    .theme-button-light {
      background: linear-gradient(135deg, #f1f5f9, #e2e8f0);
    }

    .theme-button-nature {
      background: linear-gradient(135deg, #0f1a14, #16241b);
    }

    .theme-button-night::after,
    .theme-button-girly::after,
    .theme-button-nature::after {
      content: "";
      display: block;
      width: 10px;
      height: 10px;
      margin: 12px auto;
      border-radius: 50%;
    }

    .theme-button-night::after {
      background: #3b82f6;
    }

    .theme-button-girly::after {
      background: #ec4899;
    }

    .theme-button-nature::after {
      background: #4ade80;
    }

    .theme-button-light::after {
      content: "";
      display: block;
      width: 10px;
      height: 10px;
      margin: 12px auto;
      border-radius: 50%;
      background: #2563eb;
    }

    .fab-button {
      position: fixed;
      z-index: 1500;
      bottom: max(18px, env(safe-area-inset-bottom));
      left: max(18px, env(safe-area-inset-left));
      width: 56px;
      height: 56px;
      border: 0;
      border-radius: 50%;
      color: white;
      background: linear-gradient(135deg, var(--blue), var(--blue-dark));
      font-size: 28px;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(59, 130, 246, 0.45);
      transition: transform 150ms ease;
    }

    .fab-button:active {
      transform: scale(0.9);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-shrink: 0;
    }

    .sidebar-toggle:active {
      transform: scale(0.92);
    }

    .sidebar {
      position: fixed;
      z-index: 2500;
      top: 0;
      right: 0;
      bottom: 0;
      width: 260px;
      max-width: 80vw;
      transform: translateX(100%);
      transition: transform 250ms ease;
      display: flex;
      flex-direction: column;
      padding:
        max(16px, env(safe-area-inset-top))
        16px
        max(16px, env(safe-area-inset-bottom));
      border-left: 1px solid var(--border);
      background: var(--modal-bg);
      box-shadow: -6px 0 30px rgba(0, 0, 0, 0.4);
      overflow-y: auto;
    }

    .sidebar.open {
      transform: translateX(0);
    }

    .sidebar-backdrop {
      position: fixed;
      z-index: 2400;
      inset: 0;
      display: none;
      background: var(--overlay-bg);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    .sidebar-backdrop.visible {
      display: block;
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .sidebar-header h2 {
      margin: 0;
      font-size: 16px;
      font-weight: 900;
      color: var(--text);
    }

    .sidebar-close {
      width: 32px;
      height: 32px;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      background: var(--card-light);
      font-size: 18px;
      cursor: pointer;
    }

    .sidebar-section {
      margin-bottom: 16px;
    }

    .sidebar-section-title {
      font-size: 11px;
      font-weight: bold;
      color: var(--muted);
      margin-bottom: 8px;
      padding: 0 4px;
    }

    .sidebar-item {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 11px 14px;
      border: 1px solid var(--border);
      border-radius: 13px;
      color: var(--text);
      background: var(--card-light);
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      text-align: right;
      margin-bottom: 7px;
    }

    .sidebar-item:active {
      transform: scale(0.97);
    }

    .sidebar-item-icon {
      flex-shrink: 0;
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .sidebar-item-icon.achievements {
      background: rgba(245, 158, 11, 0.18);
      color: var(--orange);
    }

    .sidebar-item-icon.whatsapp {
      background: rgba(37, 211, 102, 0.18);
      color: #25d366;
    }

    .sidebar-item-icon.install {
      background: rgba(59, 130, 246, 0.18);
      color: var(--blue);
    }

    .sidebar-item-badge {
      margin-right: auto;
      min-width: 20px;
      height: 20px;
      padding: 0 6px;
      border-radius: 999px;
      background: var(--green);
      color: white;
      font-size: 11px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .sidebar-item-badge.hidden {
      display: none;
    }

    .theme-accordion {
      border: 1px solid var(--border);
      border-radius: 13px;
      overflow: hidden;
      background: var(--card-light);
    }

    .theme-accordion-header {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 11px 14px;
      border: 0;
      color: var(--text);
      background: transparent;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      text-align: right;
    }

    .theme-accordion-chevron {
      margin-right: auto;
      font-size: 12px;
      transition: transform 200ms ease;
      color: var(--muted);
    }

    .theme-accordion.open .theme-accordion-chevron {
      transform: rotate(180deg);
    }

    .theme-accordion-body {
      display: none;
      padding: 8px 10px 12px;
      gap: 8px;
      flex-direction: column;
    }

    .theme-accordion.open .theme-accordion-body {
      display: flex;
    }

    .theme-option {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 9px 12px;
      border: 2px solid transparent;
      border-radius: 11px;
      color: var(--text);
      background: var(--card);
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      text-align: right;
    }

    .theme-option.active {
      border-color: var(--blue);
    }

    .theme-option:active {
      transform: scale(0.97);
    }

    .theme-option-swatch {
      flex-shrink: 0;
      width: 24px;
      height: 24px;
      border-radius: 7px;
      border: 1px solid var(--border);
    }

    .swatch-night {
      background: linear-gradient(135deg, #07111f, #0d1a2d);
    }

    .swatch-girly {
      background: linear-gradient(135deg, #1a0d1a, #2a1428);
    }

    .swatch-light {
      background: linear-gradient(135deg, #f1f5f9, #e2e8f0);
    }

    .swatch-nature {
      background: linear-gradient(135deg, #0f1a14, #16241b);
    }

    .sidebar-footer {
      margin-top: auto;
      padding-top: 14px;
      border-top: 1px solid var(--border);
      text-align: center;
      color: var(--muted);
      font-size: 10px;
    }

    .fullscreen-button {
      width: 100%;
      min-height: 38px;
      margin-top: 7px;
      padding: 8px 16px;
      border: 1px solid var(--border);
      border-radius: 11px;
      color: var(--text);
      background: var(--card-light);
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
    }

    .fullscreen-button:active {
      transform: scale(0.97);
    }

    .fullscreen-overlay {
      position: fixed;
      z-index: 4000;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 20px;
      background: var(--background);
    }

    .fullscreen-overlay.visible {
      display: flex;
    }

    .fullscreen-counter {
      font-size: clamp(60px, 22vw, 140px);
      font-weight: 900;
      color: var(--text);
      line-height: 1;
      text-align: center;
      font-variant-numeric: tabular-nums;
      user-select: none;
      transition: color 300ms ease, transform 300ms ease;
    }

    .fullscreen-counter.goal-reached {
      color: var(--green);
      animation: goalPulse 600ms ease;
    }

    @keyframes goalPulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }

    .fullscreen-name {
      color: var(--muted);
      font-size: 16px;
      font-weight: bold;
      text-align: center;
    }

    .fullscreen-tap-area {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .fullscreen-exit {
      position: absolute;
      top: max(12px, env(safe-area-inset-top));
      right: max(12px, env(safe-area-inset-right));
      width: 40px;
      height: 40px;
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      background: var(--card-light);
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .fullscreen-progress {
      width: 80%;
      max-width: 300px;
      height: 6px;
      border-radius: 999px;
      background: var(--progress-track);
      overflow: hidden;
    }

    .fullscreen-progress-bar {
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--green), var(--green-dark));
      transition: width 200ms ease;
    }

    .achievements-overlay {
      position: fixed;
      z-index: 3500;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding:
        max(16px, env(safe-area-inset-top))
        max(16px, env(safe-area-inset-right))
        max(16px, env(safe-area-inset-bottom))
        max(16px, env(safe-area-inset-left));
      background: var(--overlay-bg);
      backdrop-filter: blur(9px);
      -webkit-backdrop-filter: blur(9px);
    }

    .achievements-overlay.visible {
      display: flex;
    }

    .achievements-box {
      width: 100%;
      max-width: 420px;
      max-height: 85%;
      display: flex;
      flex-direction: column;
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: 22px;
      background: var(--modal-bg);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.5);
      animation: confirmBoxIn 180ms ease-out;
    }

    .achievements-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .achievements-header h2 {
      margin: 0;
      font-size: 18px;
      font-weight: 900;
      color: var(--text);
    }

    .achievements-total {
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--card-light);
      color: var(--green);
      font-size: 12px;
      font-weight: bold;
    }

    .achievements-close {
      width: 34px;
      height: 34px;
      margin-right: 8px;
      border: 1px solid var(--border);
      border-radius: 11px;
      color: var(--text);
      background: var(--card-light);
      font-size: 18px;
      cursor: pointer;
    }

    .achievements-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-left: 4px;
    }

    .achievement-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: var(--card-light);
    }

    .achievement-icon {
      flex-shrink: 0;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: rgba(34, 197, 94, 0.15);
      color: var(--green);
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .achievement-info {
      flex: 1;
      min-width: 0;
    }

    .achievement-name {
      color: var(--text);
      font-size: 13px;
      font-weight: bold;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .achievement-date {
      color: var(--muted);
      font-size: 11px;
      margin-top: 2px;
    }

    .achievement-count {
      flex-shrink: 0;
      color: var(--green);
      font-size: 13px;
      font-weight: bold;
    }

    .achievements-empty {
      text-align: center;
      padding: 30px 16px;
      color: var(--muted);
      font-size: 13px;
    }

    .achievements-empty-icon {
      font-size: 40px;
      margin-bottom: 10px;
      opacity: 0.5;
    }

    @media (max-width: 340px) {
      .theme-sidebar {
        padding: 8px 6px;
      }

      .theme-button {
        width: 28px;
        height: 28px;
      }

      .theme-button-night::after,
      .theme-button-girly::after,
      .theme-button-light::after,
      .theme-button-nature::after {
        margin: 9px auto;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
      }
    }

    .confirm-overlay {
      position: fixed;
      z-index: 3000;
      inset: 0;

      display: none;
      align-items: center;
      justify-content: center;

      padding:
        max(16px, env(safe-area-inset-top))
        max(16px, env(safe-area-inset-right))
        max(16px, env(safe-area-inset-bottom))
        max(16px, env(safe-area-inset-left));

      background: var(--overlay-bg);

      backdrop-filter: blur(9px);
      -webkit-backdrop-filter: blur(9px);
    }

    .confirm-overlay.visible {
      display: flex;
    }

    .confirm-box {
      width: 100%;
      max-width: 390px;
      padding: 22px;

      border: 1px solid var(--border);
      border-radius: 22px;

      background: var(--modal-bg);

      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.5);

      text-align: center;

      animation: confirmBoxIn 180ms ease-out;
    }

    @keyframes confirmBoxIn {
      from {
        opacity: 0;
        transform: scale(0.92) translateY(12px);
      }

      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .confirm-icon {
      display: flex;
      align-items: center;
      justify-content: center;

      width: 64px;
      height: 64px;
      margin: 0 auto 14px;

      border-radius: 20px;

      color: var(--confirm-icon-color);
      background: var(--confirm-icon-bg);

      font-size: 30px;
      font-weight: bold;
    }

    .confirm-title {
      margin: 0 0 8px;

      color: white;

      font-size: 20px;
      font-weight: 900;
    }

    .confirm-text {
      margin: 0;

      color: var(--confirm-text);

      font-size: 13px;
      line-height: 1.8;
    }

    .confirm-session-name {
      display: block;

      margin-top: 8px;

      color: #f8fafc;

      font-weight: bold;
      overflow-wrap: anywhere;
    }

    .confirm-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;

      margin-top: 20px;
    }

    .confirm-accept,
    .confirm-cancel {
      min-height: 47px;

      border: 0;
      border-radius: 13px;

      color: white;

      font-size: 13px;
      font-weight: bold;

      cursor: pointer;
    }

    .confirm-accept {
      background: linear-gradient(
        135deg,
        #ef4444,
        #b91c1c
      );
    }

    .confirm-cancel {
      background: rgba(255, 255, 255, 0.09);
    }

    .whatsapp-fab {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      width: 100%;
      min-height: 42px;
      padding: 9px 16px;
      border: 0;
      border-radius: 13px;
      color: white;
      background: linear-gradient(135deg, #25d366, #128c4b);
      box-shadow: 0 6px 18px rgba(37, 211, 102, 0.35);
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      margin-top: 7px;
    }

    .whatsapp-fab:active {
      transform: scale(0.97);
    }

    .whatsapp-fab svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .install-button {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 7px;

      width: 100%;
      min-height: 42px;
      margin-top: 7px;
      padding: 9px 16px;

      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 13px;

      color: white;
      background: linear-gradient(
        135deg,
        #3b82f6,
        #1d4ed8
      );

      box-shadow: 0 7px 20px rgba(59, 130, 246, 0.3);

      font-size: 12px;
      font-weight: bold;

      cursor: pointer;
    }

    .install-button.visible {
      display: flex;
    }

    .install-button:active {
      transform: scale(0.97);
    }

    .install-button svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }
  </style>
</head>

<body>

  <main class="app">

    <header class="top-header">
      <button
        id="sidebarToggle"
        class="sidebar-toggle"
        type="button"
        aria-label="القائمة"
      >
        ☰
      </button>

      <div class="title-area">
        <h1>عداد الأوراد</h1>
        <p class="dedication">عن روح الحاجة زبيدة حمود</p>
      </div>
    </header>

    <section
      id="sessionsPanel"
      class="sessions-panel"
      hidden
    >
      <div
        id="sessionsList"
        class="sessions-list"
      ></div>
    </section>

    <section
      id="mainArea"
      class="main-area"
    ></section>

  </main>

  <div
    id="message"
    class="message"
    role="status"
  ></div>

  <div
    id="sessionModal"
    class="modal-overlay"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modalTitle"
    aria-hidden="true"
  >
    <div class="modal">

      <div class="modal-header">
        <h2 id="modalTitle">جلسة جديدة</h2>

        <button
          id="closeModalButton"
          class="close-modal"
          type="button"
          aria-label="إغلاق"
        >
          ×
        </button>
      </div>

      <div class="form-group">
        <label for="sessionNameInput">
          اسم الورد أو الجلسة
        </label>

        <input
          id="sessionNameInput"
          type="text"
          maxlength="80"
          placeholder="مثال: بسم الله الرحمن الرحيم"
        >
      </div>

      <div class="form-group">
        <label for="sessionGoalInput">
          الهدف المطلوب
        </label>

        <input
          id="sessionGoalInput"
          type="number"
          inputmode="numeric"
          min="1"
          step="1"
          placeholder="مثال: 100000"
        >
      </div>

      <div class="form-group">
        <label for="sessionStartInput">
          العدد الحالي أو نقطة البداية
        </label>

        <input
          id="sessionStartInput"
          type="number"
          inputmode="numeric"
          min="0"
          step="1"
          placeholder="0"
        >
      </div>

      <div class="modal-actions">
        <button
          id="saveSessionButton"
          class="modal-save"
          type="button"
        >
          حفظ
        </button>

        <button
          id="cancelModalButton"
          class="modal-cancel"
          type="button"
        >
          إلغاء
        </button>
      </div>

    </div>
  </div>

  <div
    id="confirmOverlay"
    class="confirm-overlay"
    role="dialog"
    aria-modal="true"
    aria-labelledby="confirmTitle"
    aria-hidden="true"
  >
    <div class="confirm-box">

      <div
        id="confirmIcon"
        class="confirm-icon"
      >
        !
      </div>

      <h2
        id="confirmTitle"
        class="confirm-title"
      >
        تأكيد العملية
      </h2>

      <p
        id="confirmText"
        class="confirm-text"
      ></p>

      <div class="confirm-actions">

        <button
          id="confirmAcceptButton"
          class="confirm-accept"
          type="button"
        >
          تأكيد
        </button>

        <button
          id="confirmCancelButton"
          class="confirm-cancel"
          type="button"
        >
          إلغاء
        </button>

      </div>

    </div>
  </div>

  <div
    id="fullscreenOverlay"
    class="fullscreen-overlay"
    aria-hidden="true"
  >
    <button
      id="fullscreenExit"
      class="fullscreen-exit"
      type="button"
      aria-label="خروج"
    >
      ×
    </button>

    <div
      id="fullscreenName"
      class="fullscreen-name"
    ></div>

    <div
      class="fullscreen-tap-area"
      role="button"
      tabindex="0"
      aria-label="زيادة العداد بالضغط هنا"
    >
      <div
        id="fullscreenCounter"
        class="fullscreen-counter"
      >0</div>
    </div>

    <div class="fullscreen-progress">
      <div
        id="fullscreenProgressBar"
        class="fullscreen-progress-bar"
        style="width: 0%"
      ></div>
    </div>
  </div>

  <div
    id="achievementsOverlay"
    class="achievements-overlay"
    role="dialog"
    aria-modal="true"
    aria-labelledby="achievementsTitle"
    aria-hidden="true"
  >
    <div class="achievements-box">

      <div class="achievements-header">
        <h2 id="achievementsTitle">سجل الإنجازات</h2>

        <div style="display: flex; align-items: center;">
          <span
            id="achievementsTotal"
            class="achievements-total"
          >0 إنجاز</span>

          <button
            id="achievementsClose"
            class="achievements-close"
            type="button"
            aria-label="إغلاق"
          >
            ×
          </button>
        </div>
      </div>

      <div
        id="achievementsList"
        class="achievements-list"
      ></div>

    </div>
  </div>

  <div
    id="sidebarBackdrop"
    class="sidebar-backdrop"
  ></div>

  <aside
    id="sidebar"
    class="sidebar"
    aria-hidden="true"
  >
    <div class="sidebar-header">
      <h2>القائمة</h2>

      <button
        id="sidebarClose"
        class="sidebar-close"
        type="button"
        aria-label="إغلاق"
      >
        ×
      </button>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-section-title">الجلسات</div>

      <button
        id="newSessionButton"
        class="sidebar-item"
        type="button"
      >
        <span class="sidebar-item-icon install">＋</span>
        جلسة جديدة
      </button>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-section-title">الإنجازات</div>

      <button
        id="sidebarAchievements"
        class="sidebar-item"
        type="button"
      >
        <span class="sidebar-item-icon achievements">🏆</span>

    function formatDate(timestamp) {
      const date = new Date(timestamp);

      const months = [
        "يناير", "فبراير", "مارس",
        "أبريل", "مايو", "يونيو",
        "يوليو", "أغسطس", "سبتمبر",
        "أكتوبر", "نوفمبر", "ديسمبر"
      ];

      const day = date.getDate();
      const month = months[date.getMonth()];
      const year = date.getFullYear();

      const hours = String(date.getHours()).padStart(2, "0");
      const minutes = String(date.getMinutes()).padStart(2, "0");

      return day + " " + month + " " + year +
        " - " + hours + ":" + minutes;
    }

    let lastFocusedElement = null;

    function trapFocus(container) {
      const focusable =
        container.querySelectorAll(
          'button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'
        );

      if (focusable.length === 0) {
        return null;
      }

      const first = focusable[0];
      const last = focusable[focusable.length - 1];

      first.focus();

      function handler(event) {
        if (event.key !== "Tab") {
          return;
        }

        if (event.shiftKey) {
          if (document.activeElement === first) {
            event.preventDefault();
            last.focus();
          }
        } else {
          if (document.activeElement === last) {
            event.preventDefault();
            first.focus();
          }
        }
      }

      container.addEventListener("keydown", handler);

      return function untrap() {
        container.removeEventListener("keydown", handler);
      };
    }

    function openWithFocusTrap(overlay, triggerElement) {
      lastFocusedElement = triggerElement || document.activeElement;
      overlay.classList.add("visible");
      overlay.setAttribute("aria-hidden", "false");
      return trapFocus(overlay);
    }

    function closeWithFocusRestore(overlay, untrapFn) {
      overlay.classList.remove("visible");
      overlay.setAttribute("aria-hidden", "true");

      if (typeof untrapFn === "function") {
        untrapFn();
      }

      if (
        lastFocusedElement &&
        typeof lastFocusedElement.focus === "function"
      ) {
        lastFocusedElement.focus();
      }
    }

    function createId() {
      return (
        Date.now().toString(36) +
        Math.random().toString(36).slice(2, 9)
      );
    }

    function formatNumber(value) {
      return new Intl.NumberFormat("ar", {
        maximumFractionDigits: 0
      }).format(value);
    }

    function normalizeSession(session) {
      const goal = Number(session.goal);
      const count = Number(session.count);
      const customIncrease =
        Number(session.customIncrease);

      return {
        id:
          typeof session.id === "string"
            ? session.id
            : createId(),

        name:
          typeof session.name === "string" &&
          session.name.trim() !== ""
            ? session.name.trim()
            : "جلسة بدون اسم",

        goal:
          Number.isFinite(goal) && goal > 0
            ? Math.floor(goal)
            : 0,

        count:
          Number.isFinite(count) && count >= 0
            ? Math.floor(count)
            : 0,

        customIncrease:
          Number.isFinite(customIncrease) &&
          customIncrease > 0
            ? Math.floor(customIncrease)
            : 1,

        createdAt:
          Number(session.createdAt) || Date.now(),

        updatedAt:
          Number(session.updatedAt) || Date.now()
      };
    }

    function loadData() {
      try {
        const savedSessions =
          localStorage.getItem(STORAGE_KEY);

        const savedActiveSession =
          localStorage.getItem(ACTIVE_SESSION_KEY);

        if (savedSessions) {
          const parsed = JSON.parse(savedSessions);

          if (Array.isArray(parsed)) {
            sessions = parsed.map(normalizeSession);
          }
        }

        if (
          savedActiveSession &&
          sessions.some(function (session) {
            return session.id === savedActiveSession;
          })
        ) {
          activeSessionId = savedActiveSession;
        } else if (sessions.length > 0) {
          activeSessionId = sessions[0].id;
        }

      } catch (error) {
        sessions = [];
        activeSessionId = null;
      }
    }

    function saveData() {
      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(sessions)
      );

      if (activeSessionId) {
        localStorage.setItem(
          ACTIVE_SESSION_KEY,
          activeSessionId
        );
      } else {
        localStorage.removeItem(
          ACTIVE_SESSION_KEY
        );
      }
    }

    function getActiveSession() {
      return sessions.find(function (session) {
        return session.id === activeSessionId;
      }) || null;
    }

    function showMessage(text) {

    function animateCounter() {

      counterElement.classList.remove("animate");

      void counterElement.offsetWidth;

      counterElement.classList.add("animate");
    }

    function renderSessions() {
      sessionsList.innerHTML = "";

      sessionsPanel.hidden =
        sessions.length === 0;

      sessions.forEach(function (session) {
        const button =
          document.createElement("button");

        button.type = "button";
        button.className = "session-tab";

        if (session.id === activeSessionId) {
          button.classList.add("active");

        const name =
          document.createElement("span");

        name.className = "session-tab-name";
        name.textContent = session.name;

        const number =
          document.createElement("span");

        number.className = "session-tab-number";

        number.textContent =
          session.goal > 0
            ? session.count + " / " + session.goal
            : String(session.count);

        button.appendChild(name);
        button.appendChild(number);

        button.addEventListener(
          "click",
          function () {
            activeSessionId = session.id;
            saveData();
            render();

            requestAnimationFrame(function () {
              button.scrollIntoView({
                behavior: "smooth",
                inline: "center",
                block: "nearest"
              });
            });
          }
        );

        sessionsList.appendChild(button);
      });
    }

            id="emptyCreateButton"
            class="empty-create-button"
            type="button"
          >
            إنشاء أول جلسة
          </button>
        </div>
      `;

      document
        .getElementById("emptyCreateButton")
        .addEventListener(
          "click",
          openCreateModal
        );
    }

    function renderActiveSession() {
      const session = getActiveSession();

      if (!session) {
        renderEmptyState();
        return;
      }

      let percent = 0;

      if (session.goal > 0) {
        percent =
          (session.count / session.goal) * 100;
      }

      const progressWidth = Math.min(
        Math.max(percent, 0),
        100
      );

      mainArea.innerHTML = `
        <section class="session-card">

          <div class="session-card-header">
            <div class="session-info">
              <h2 class="session-name">
                ${escapeHtml(session.name)}
              </h2>

              <p class="session-target">
                ${
                  session.goal > 0
                    ? "الهدف: " +
                      formatNumber(session.goal)
                    : "بدون هدف محدد"
                }
              </p>
            </div>

            <button
              id="editSessionButton"
              class="edit-button"
              type="button"
            >
              تعديل
            </button>
          </div>

          <div class="counter-section">
            <div class="counter-box">
              <div
                id="counterValue"
                aria-live="polite"
                aria-atomic="true"
              >
                ${formatNumber(session.count)}
              </div>
            </div>

            <div class="progress-area">
              <div class="progress-track">
                <div
                  class="progress-bar"
                  style="width: ${progressWidth}%"
                ></div>
              </div>

              <div class="progress-text">
                ${
                  session.goal > 0
                    ? Math.floor(percent) + "%"
                    : "—"
                }
              </div>
            </div>
          </div>

          <div class="main-add-row">
            <button
              id="increaseOneButton"
              class="main-add-button"
              type="button"
            >
              ＋ زيادة واحدة
            </button>

            <button
              id="undoButton"
              class="undo-button"
              type="button"
              aria-label="تراجع عن آخر زيادة"
              title="تراجع"
            >
              −
            </button>
          </div>

          <div class="compact-row">
            <input
              id="customIncreaseInput"
              type="number"
              inputmode="numeric"
              min="1"
              step="1"
              value="${session.customIncrease}"
              placeholder="قيمة الزيادة"
            >

            <button
              id="customIncreaseButton"
              class="action-button"
              type="button"
            >
              زيادة
            </button>
          </div>

          <button
            id="manageSessionButton"
            class="manage-session-button"
            type="button"
            aria-expanded="false"
          >
            ⚙ إدارة الجلسة
          </button>

          <div id="manageMenu" class="manage-menu">
            <div class="compact-row">
              <input
                id="setNumberInput"
                type="number"
                inputmode="numeric"
                min="0"
                step="1"
                placeholder="تعيين العدد الحالي"
              >

              <button
                id="setNumberButton"
                class="action-button"
                type="button"
              >
                تعيين
              </button>
            </div>

            <div class="bottom-actions">
              <button
                id="resetButton"
                class="reset-button"
                type="button"
              >
                تصفير الجلسة
              </button>

              <button
                id="deleteButton"
                class="delete-button"
                type="button"
              >
                حذف الجلسة
              </button>
            </div>
          </div>

          <button
            id="fullscreenButton"
            class="fullscreen-button"
            type="button"
          >
            ⤢ وضع ملء الشاشة
          </button>

          <button
            id="installAppButton"
            class="install-button"
            type="button"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M12 3v12"></path>
              <path d="m7 10 5 5 5-5"></path>
              <path d="M5 21h14"></path>
            </svg>

            تثبيت التطبيق على الهاتف
          </button>

        </section>
      `;

      bindSessionEvents();
    }

    function bindSessionEvents() {
      const increaseOneButton =
        document.getElementById(
          "increaseOneButton"
        );

      const customIncreaseInput =
        document.getElementById(
          "customIncreaseInput"
        );

      const customIncreaseButton =
        document.getElementById(
          "customIncreaseButton"
        );

      const undoButton =
        document.getElementById(
          "undoButton"
        );

      const manageSessionButton =
        document.getElementById(
          "manageSessionButton"
        );

      const manageMenu =
        document.getElementById(
          "manageMenu"
        );

      const setNumberInput =
        document.getElementById(
          "setNumberInput"
        );

      const setNumberButton =
        document.getElementById(
          "setNumberButton"
        );

      const resetButton =
        document.getElementById(
          "resetButton"
        );

      const deleteButton =
        document.getElementById(
          "deleteButton"
        );

      const editSessionButton =
        document.getElementById(
          "editSessionButton"
        );

      const fullscreenButton =
        document.getElementById(
          "fullscreenButton"
        );

      const installAppButton =
        document.getElementById(
          "installAppButton"
        );

      increaseOneButton.addEventListener(
        "click",
        function () {
          const session = getActiveSession();

          if (!session) {
            return;
          }

          const wasComplete =
            session.goal > 0 &&
            session.count >= session.goal;

          session.count += 1;
          session.updatedAt = Date.now();

          saveData();
          render();
          animateCounter();

          if (
            !wasComplete &&
            session.goal > 0 &&
            session.count >= session.goal
          ) {
            recordAchievement(session);
            showMessage("🎉 أكملت الهدف!");
            vibrateGoalReached();
          } else {
            vibrate(30);
          }
        }
      );

      undoButton.addEventListener(
        "click",
        function () {
          const session = getActiveSession();

          if (!session) {
            return;
          }

          if (session.count <= 0) {
            showMessage("العداد بالفعل صفر");
            return;
          }

          session.count -= 1;
          session.updatedAt = Date.now();

          saveData();
          render();
          animateCounter();

          vibrate(10);
        }
      );

      manageSessionButton.addEventListener(
        "click",
        function () {
          const isOpen =
            manageMenu.classList.toggle("open");

          manageSessionButton.setAttribute(
            "aria-expanded",
            isOpen ? "true" : "false"
          );
        }
      );

      customIncreaseButton.addEventListener(
        "click",
        function () {
          const value = Number(
            customIncreaseInput.value
          );

          if (
            !Number.isFinite(value) ||
            value <= 0
          ) {
            showMessage(
              "اكتب قيمة زيادة أكبر من صفر"
            );

            customIncreaseInput.focus();
            return;
          }

          const session = getActiveSession();

          if (!session) {
            return;
          }

          const wasComplete =
            session.goal > 0 &&
            session.count >= session.goal;

          session.customIncrease =
            Math.floor(value);

          session.count +=
            session.customIncrease;

          session.updatedAt = Date.now();

          saveData();
          render();
          animateCounter();

          if (
            !wasComplete &&
            session.goal > 0 &&
            session.count >= session.goal
          ) {
            recordAchievement(session);
            showMessage("🎉 أكملت الهدف!");
            vibrateGoalReached();
          } else {
            vibrate(30);
          }
        }
      );

      customIncreaseInput.addEventListener(
        "change",
        function () {
          const value = Number(
            customIncreaseInput.value
          );

          const session = getActiveSession();

          if (
            session &&
            Number.isFinite(value) &&
            value > 0
          ) {
            session.customIncrease =
              Math.floor(value);

            session.updatedAt = Date.now();

            saveData();
          }
        }
      );

      setNumberButton.addEventListener(
        "click",
        function () {
          const value = Number(
            setNumberInput.value
          );

          if (
            setNumberInput.value.trim() === "" ||
            !Number.isFinite(value) ||
            value < 0
          ) {
            showMessage(
              "اكتب صفرًا أو رقمًا أكبر منه"
            );

            setNumberInput.focus();
            return;
          }

          const session = getActiveSession();

          if (!session) {
            return;
          }

          session.count = Math.floor(value);
          session.updatedAt = Date.now();

          saveData();
          render();
          animateCounter();

          showMessage("تم تعيين العدد");
        }
      );

      resetButton.addEventListener(
        "click",
        function () {
          const session = getActiveSession();

          if (!session) {
            return;
          }

          openConfirm({
            title: "تصفير الجلسة",
            message:
              "سيتم إعادة عداد الجلسة إلى الصفر." +
              '<span class="confirm-session-name">' +
              escapeHtml(session.name) +
              "</span>",

            acceptText: "نعم، تصفير",

            onConfirm: function () {
              session.count = 0;
              session.updatedAt = Date.now();

              saveData();
              render();
              animateCounter();

              showMessage("تم تصفير الجلسة");
            }
          });
        }
      );

      deleteButton.addEventListener(
        "click",
        deleteActiveSession
      );

      editSessionButton.addEventListener(
        "click",
        openEditModal
      );

      customIncreaseInput.addEventListener(
        "keydown",
        function (event) {
          if (event.key === "Enter") {
            customIncreaseButton.click();
          }
        }
      );

      setNumberInput.addEventListener(
        "keydown",
        function (event) {
          if (event.key === "Enter") {
            setNumberButton.click();
          }
        }
      );

      if (fullscreenButton) {
        fullscreenButton.addEventListener(
          "click",
          openFullscreen
        );
      }

      if (installAppButton) {
        installAppButton.addEventListener(
          "click",
          installApplication
        );

        showInstallButton();
      }
    }

    function deleteActiveSession() {
      const session = getActiveSession();

      if (!session) {
        return;
      }

      openConfirm({
        title: "حذف الجلسة",

        message:
          "سيتم حذف الجلسة وجميع بياناتها نهائيًا." +
          '<span class="confirm-session-name">' +
          escapeHtml(session.name) +
          "</span>",

        acceptText: "نعم، حذف",

        onConfirm: function () {
          const currentIndex =
            sessions.findIndex(function (item) {
              return item.id === session.id;
            });

          sessions = sessions.filter(
            function (item) {
              return item.id !== session.id;
            }
          );

          if (sessions.length > 0) {
            const nextIndex = Math.min(
              currentIndex,
              sessions.length - 1
            );

            activeSessionId =
              sessions[nextIndex].id;
          } else {
            activeSessionId = null;
          }

          saveData();
          render();

          showMessage("تم حذف الجلسة");
        }
      });
    }

    let modalUntrap = null;

    function openModal() {
      modalUntrap = openWithFocusTrap(
        sessionModal,
        document.activeElement
      );

      setTimeout(function () {
        sessionNameInput.focus();
      }, 80);
    }

    function closeModal() {
      closeWithFocusRestore(sessionModal, modalUntrap);
      modalUntrap = null;
    }

    function openCreateModal() {
      modalMode = "create";

      modalTitle.textContent =
        "إنشاء جلسة جديدة";

      saveSessionButton.textContent =
        "إنشاء الجلسة";

      sessionNameInput.value = "";
      sessionGoalInput.value = "";
      sessionStartInput.value = "0";

      openModal();
    }

    function openEditModal() {
      const session = getActiveSession();

      if (!session) {
        return;
      }

      modalMode = "edit";

      modalTitle.textContent =
        "تعديل الجلسة";

      saveSessionButton.textContent =
        "حفظ التعديلات";

      sessionNameInput.value =
        session.name;

      sessionGoalInput.value =
        session.goal > 0
          ? String(session.goal)
          : "";

      sessionStartInput.value =
        String(session.count);

      openModal();
    }

    function saveSessionFromModal() {
      const name =
        sessionNameInput.value.trim();

      const goalText =
        sessionGoalInput.value.trim();

      const startText =
        sessionStartInput.value.trim();

      if (name === "") {
        alert("يرجى كتابة اسم الجلسة.");

        sessionNameInput.focus();
        return;
      }

      let goal = 0;
      let count = 0;

      if (goalText !== "") {
        goal = Number(goalText);

        if (
          !Number.isFinite(goal) ||
          goal <= 0
        ) {
          alert(
            "الهدف يجب أن يكون أكبر من صفر."
          );

          sessionGoalInput.focus();
          return;
        }

        goal = Math.floor(goal);
      }

      if (startText !== "") {
        count = Number(startText);

        if (
          !Number.isFinite(count) ||
          count < 0
        ) {
          alert(
            "العدد الحالي يجب أن يكون صفرًا أو أكبر."
          );

          sessionStartInput.focus();
          return;
        }

        count = Math.floor(count);
      }

      if (modalMode === "create") {
        const newSession = {
          id: createId(),
          name: name,
          goal: goal,
          count: count,
          customIncrease: 1,
          createdAt: Date.now(),
          updatedAt: Date.now()
        };

        sessions.unshift(newSession);
        activeSessionId = newSession.id;

      } else {
        const session = getActiveSession();

        if (!session) {
          return;
        }

        session.name = name;
        session.goal = goal;
        session.count = count;
        session.updatedAt = Date.now();
      }

      saveData();
      closeModal();
      render();

      showMessage("تم حفظ الجلسة");
    }

    function escapeHtml(text) {
      return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function render() {
      renderSessions();

      if (sessions.length === 0) {
        renderEmptyState();
      } else {
        renderActiveSession();
      }
    }

    newSessionButton.addEventListener(
      "click",
      function () {
        closeSidebar();
        setTimeout(openCreateModal, 250);
      }
    );

    saveSessionButton.addEventListener(
      "click",
      saveSessionFromModal
    );

    cancelModalButton.addEventListener(
      "click",
      closeModal
    );

    closeModalButton.addEventListener(
      "click",
      closeModal
    );

    sessionModal.addEventListener(
      "click",
      function (event) {
        if (event.target === sessionModal) {
          closeModal();
        }
      }
    );

    document.addEventListener(
      "keydown",
      function (event) {
        if (event.key !== "Escape") {
          return;
        }

        if (
          sidebar.classList.contains("open")
        ) {
          closeSidebar();
          return;
        }

        if (
          fullscreenOverlay.classList.contains("visible")
        ) {
          closeFullscreen();
          return;
        }

        if (
          achievementsOverlay.classList.contains("visible")
        ) {
          closeAchievements();
          return;
        }

        if (
          confirmOverlay.classList.contains("visible")
        ) {
          closeConfirm();
          return;
        }

        if (
          sessionModal.classList.contains("visible")
        ) {
          closeModal();
        }
      }
    );

    window.addEventListener(
      "beforeinstallprompt",
      function (event) {
        event.preventDefault();

        deferredInstallPrompt = event;

        showInstallButton();
      }
    );

    function showInstallButton() {
      const installButton =
        document.getElementById("installAppButton");

      if (
        installButton &&
        deferredInstallPrompt
      ) {
        installButton.classList.add("visible");
      }
    }

    async function installApplication() {
      if (!deferredInstallPrompt) {
        showInstallInstructions();
        return;
      }

      deferredInstallPrompt.prompt();

      const result =
        await deferredInstallPrompt.userChoice;

      if (result.outcome === "accepted") {
        showMessage("جاري تثبيت التطبيق");
      }

      deferredInstallPrompt = null;

      const installButton =
        document.getElementById("installAppButton");

      if (installButton) {
        installButton.classList.remove("visible");
      }
    }

    function showInstallInstructions() {
      const isIOS =
        /iphone|ipad|ipod/i.test(
          navigator.userAgent
        );

      if (isIOS) {
        openConfirm({
          title: "تثبيت التطبيق",

          message:
            "لتثبيت التطبيق على الآيفون:" +
            "<br>" +
            "افتح الصفحة في Safari، ثم اضغط زر المشاركة، وبعدها اختر:" +
            '<span class="confirm-session-name">' +
            "إضافة إلى الشاشة الرئيسية" +
            "</span>",

          acceptText: "حسنًا",

          onConfirm: function () {}
        });

        return;
      }

      showMessage(
        "استخدم قائمة المتصفح ثم اختر تثبيت التطبيق"
      );
    }

    window.addEventListener(
      "appinstalled",
      function () {
        deferredInstallPrompt = null;

        const installButton =
          document.getElementById("installAppButton");

        if (installButton) {
          installButton.classList.remove("visible");
        }

        showMessage("تم تثبيت التطبيق بنجاح");
      }
    );

    loadData();
    loadAchievements();
    render();

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker
          .register("sw.js")
          .catch(function (error) {
            console.log("SW registration failed:", error);
          });
      });
    }
  </script>

</body>
</html>
